spring:
  application:
    name: captureu
  profiles:
    default: local
  config:
    # 로컬 비밀값(.env, 커밋 안 됨)을 읽는다. 없으면 건너뛴다. 형식은 .env.example 참고
    import: optional:file:.env[.properties]
  lifecycle:
    # 종료할 때 진행 중인 분석(수십 초 걸림)이 끝날 때까지 기다린다
    timeout-per-shutdown-phase: 60s
  data:
    redis:
      # Redis는 캐시 용도라, 느려지면 오래 기다리지 않고 캐시 없이 진행한다 (기본 60초는 너무 김)
      timeout: 500ms
      connect-timeout: 1s
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instant를 MySQL DATETIME(6)으로 저장한다 (값은 UTC)
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true

captureu:
  instagram:
    graph:
      access-token: ${IG_ACCESS_TOKEN:}
      ig-user-id: ${IG_USER_ID:}
  auth:
    # 인스타 로그인 (#16). 넷 다 있어야 로그인 버튼이 동작한다. 형식은 .env.example 참고
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    config-id: ${META_LOGIN_CONFIG_ID:}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/auth/callback}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    # 로그인하지 않았을 때 .env의 IG_USER_ID 계정을 쓴다 (로컬 개발용. 배포에서는 false)
    env-fallback: ${AUTH_ENV_FALLBACK:true}
  llm:
    anthropic:
      # 없으면 LLM 없이 템플릿으로 추천한다 (#13)
      api-key: ${ANTHROPIC_API_KEY:}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 7d

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
