spring:
  application:
    name: captureu
  profiles:
    default: local
  config:
    # 로컬 비밀값(.env, 커밋 안 됨)을 읽는다. 없으면 건너뛴다. 형식은 .env.example 참고
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

captureu:
  instagram:
    graph:
      access-token: ${IG_ACCESS_TOKEN:}
      ig-user-id: ${IG_USER_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
