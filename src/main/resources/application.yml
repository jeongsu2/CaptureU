spring:
  application:
    name: captureu
  profiles:
    default: local
  config:
    # 로컬 비밀값(.env, 커밋 안 됨)을 읽는다. 없으면 건너뛴다. 형식은 .env.example 참고
    import: optional:file:.env[.properties]
  lifecycle:
    # 종료할 때 진행 중인 분석(수십 초 걸림)이 끝날 때까지 기다린다
    timeout-per-shutdown-phase: 60s
  data:
    redis:
      # Redis는 캐시 용도라, 느려지면 오래 기다리지 않고 캐시 없이 진행한다 (기본 60초는 너무 김)
      timeout: 500ms
      connect-timeout: 1s
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instant를 MySQL DATETIME(6)으로 저장한다 (값은 UTC)
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true

captureu:
  instagram:
    graph:
      access-token: ${IG_ACCESS_TOKEN:}
      ig-user-id: ${IG_USER_ID:}
  llm:
    anthropic:
      # 없으면 LLM 없이 템플릿으로 추천한다 (#13)
      api-key: ${ANTHROPIC_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
