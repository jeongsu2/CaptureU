spring:
  application:
    name: captureu
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
