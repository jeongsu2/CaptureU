# 로컬 개발 프로필 (기본값).
# DB, Redis 연결 정보는 spring-boot-docker-compose가 compose.yaml에서 읽어 자동으로 채운다.
spring:
  docker:
    compose:
      lifecycle-management: start-only

captureu:
  auth:
    # 로컬 개발: 로그인하지 않으면 .env의 IG_USER_ID·IG_ACCESS_TOKEN 계정으로 동작한다
    env-fallback: ${AUTH_ENV_FALLBACK:true}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.captureu: debug
