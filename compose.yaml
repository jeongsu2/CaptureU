# 로컬 개발용 인프라. 애플리케이션을 실행하면 Spring Boot가 자동으로 띄우고 연결한다.
# 직접 띄울 때: docker compose up -d
# 비밀번호는 로컬 전용 값이다. 운영 환경에서는 쓰지 않는다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: captureu
      MYSQL_USER: captureu
      MYSQL_PASSWORD: captureu-local
      MYSQL_ROOT_PASSWORD: captureu-local-root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8.4
    ports:
      - "6379:6379"

volumes:
  mysql-data:
